services:
  - type: web
    name: dock-operations-analytics
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Rebuild the sample data on every start so the demo always shows the last 6 months
    startCommand: python seed_data.py && gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
